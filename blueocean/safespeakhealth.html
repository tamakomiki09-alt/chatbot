<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpeak Health | Demo Prototype</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root { --navy: #002b5b; --white: #ffffff; --light-gray: #f8f9fa; --danger: #d32f2f; --success: #2e7d32; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #root { width: 375px; height: 750px; background: white; border: 10px solid #111; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .screen { height: 100%; display: flex; flex-direction: column; padding: 30px; box-sizing: border-box; }
        .patient-mode { background: var(--navy); color: var(--white); text-align: center; }
        .clinician-mode { background: var(--light-gray); color: #333; }
        .btn { padding: 20px; margin: 10px 0; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-light { background: var(--white); color: var(--navy); }
        .btn-dark { background: var(--navy); color: var(--white); }
        .risk-tag { display: inline-block; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; color: white; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function SafeSpeakDemo() {
            const [step, setStep] = useState(0); // 0: Start, 1-3: Symptoms, 4: Guidance, 5: Teach-back, 6: Summary
            const [responses, setResponses] = useState([]);
            const [teachBackResult, setTeachBackResult] = useState(null);

            const questions = [
                { q: "Are you in pain right now?", t: "¿Siente dolor ahora?" },
                { q: "Is the pain worse than yesterday?", t: "¿El dolor es peor que ayer?" },
                { q: "Do you have any numbness?", t: "¿Siente algún entumecimiento?" }
            ];

            const handleSymptom = (ans) => {
                setResponses([...responses, { q: questions[step-1].q, a: ans }]);
                setStep(step + 1);
            };

            // 0. START SCREEN
            if (step === 0) return (
                <div className="screen clinician-mode" style={{justifyContent: 'center'}}>
                    <h1 style={{color: 'var(--navy)'}}>SafeSpeak Health</h1>
                    <p>Demo Scenario: Pain Assessment (ES)</p>
                    <button className="btn btn-dark" onClick={() => setStep(1)}>Start Patient Check-In</button>
                </div>
            );

            // 1-3. SYMPTOM QUESTIONS (Patient View)
            if (step >= 1 && step <= 3) return (
                <div className="screen patient-mode">
                    <p style={{opacity: 0.7}}>Question {step} of 3</p>
                    <h1 style={{fontSize: '32px', margin: '40px 0'}}>{questions[step-1].t}</h1>
                    <button className="btn btn-light" onClick={() => handleSymptom('YES')}>YES / SÍ</button>
                    <button className="btn btn-light" onClick={() => handleSymptom('NO')}>NO</button>
                </div>
            );

            // 4. PRE-APPROVED GUIDANCE (Patient View)
            if (step === 4) return (
                <div className="screen patient-mode">
                    <h2 style={{color: '#ffcc00'}}>Important Information</h2>
                    <p style={{fontSize: '22px', lineHeight: '1.4'}}>
                        "If your pain becomes sharp or you cannot walk, please notify the nurse immediately."
                    </p>
                    <p style={{fontSize: '18px', opacity: 0.8, fontStyle: 'italic'}}>
                        "Si el dolor se vuelve agudo o no puede caminar, avise a la enfermera de inmediato."
                    </p>
                    <button className="btn btn-light" style={{marginTop: 'auto'}} onClick={() => setStep(5)}>I Read This / He leído esto</button>
                </div>
            );

            // 5. TEACH-BACK VERIFICATION (Patient View)
            if (step === 5) return (
                <div className="screen patient-mode">
                    <h2>Teach-Back Verification</h2>
                    <p>What should you do if the pain becomes sharp?</p>
                    <button className="btn btn-light" onClick={() => { setTeachBackResult('Correct'); setStep(6); }}>
                        Call the nurse immediately / Llamar a la enfermera
                    </button>
                    <button className="btn btn-light" onClick={() => { setTeachBackResult('Incorrect'); setStep(6); }}>
                        Wait until tomorrow / Esperar hasta mañana
                    </button>
                    <button className="btn btn-light" style={{background: 'transparent', color: 'white', border: '1px solid white'}} onClick={() => { setTeachBackResult('Uncertain'); setStep(6); }}>
                        I don't understand / No entiendo
                    </button>
                </div>
            );

            // 6. CLINICIAN SUMMARY (Clinician View)
            const risk = teachBackResult === 'Correct' ? {l: 'LOW', c: 'var(--success)'} : {l: 'HIGH', c: 'var(--danger)'};
            
            return (
                <div className="screen clinician-mode">
                    <h3 style={{margin: 0}}>Session Summary</h3>
                    <div className="risk-tag" style={{backgroundColor: risk.c}}>COMMUNICATION RISK: {risk.l}</div>
                    
                    <div style={{marginTop: '20px', fontSize: '14px'}}>
                        <strong>Symptoms Log:</strong>
                        {responses.map((r, i) => <div key={i} style={{padding: '5px 0'}}>• {r.q}: {r.a}</div>)}
                        
                        <hr />
                        <strong>Guidance Shown:</strong>
                        <p style={{fontSize: '12px', color: '#666'}}>Emergency notification instructions (Nurse escalation).</p>
                        
                        <hr />
                        <strong>Teach-Back Result:</strong>
                        <div style={{color: risk.c, fontWeight: 'bold'}}>{teachBackResult}</div>
                    </div>

                    {teachBackResult !== 'Correct' && (
                        <div style={{color: 'var(--danger)', fontSize: '12px', marginTop: '10px', fontWeight: 'bold'}}>
                            ⚠️ Warning: Patient did not verify understanding. Use an interpreter.
                        </div>
                    )}
                    
                    <button className="btn btn-dark" style={{marginTop: 'auto'}} onClick={() => window.location.reload()}>Reset Demo</button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SafeSpeakDemo />);
    </script>
</body>
</html>
